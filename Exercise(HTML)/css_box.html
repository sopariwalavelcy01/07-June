<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;
            height: 100px;

            /* Padding */
            padding: 50px;

            /* Border */
            border: 5px solid black;

            /* Margin */
            margin: 30px 50px;

            background-color: lightgreen;
        }

        .content {
            width: 300px;
            height: 100px;
            background-color: skyblue;

            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="content">
            Content
        </div>
    </div>

</body>
</html>
